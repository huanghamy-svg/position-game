<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>語伴遊戲樂園</title>
<style>
:root{--bg:#fbf6ee;--ink:#4a3b32;--line:#e6d8c4;--teal:#3aaeb5;--pink:#f3a9b9;--sun:#ffc94d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5vh;padding:24px 16px}
.title{display:flex;align-items:center;gap:16px}
.title img{width:72px;height:72px;border-radius:16px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.08)}
h1{margin:0;font-size:clamp(28px,5vw,46px);letter-spacing:.06em}
.games{display:flex;gap:5vw;flex-wrap:wrap;justify-content:center}
a.g{width:clamp(200px,32vw,320px);aspect-ratio:1/1.05;border-radius:32px;background:#fff;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;box-shadow:0 8px 0 var(--line),0 12px 26px rgba(74,59,50,.1);transition:transform .12s}
a.g:active{transform:translateY(6px);box-shadow:0 2px 0 var(--line)}
.pic{font-size:clamp(64px,10vw,104px);line-height:1}
.name{font-size:clamp(20px,2.6vw,28px);font-weight:700;padding:6px 20px;border-radius:999px}
</style>
</head>
<body>
  <div class="title"><img src="img/logo.png" alt="語伴計畫"><h1>語伴遊戲樂園</h1></div>
  <div class="games">
    <a class="g" href="https://huanghamy-svg.github.io/fruit-game/"><span class="pic">🚂🍎</span><span class="name" style="background:#ffe9ef">水果配對小火車</span></a>
    <a class="g" href="index.html?from=all"><span class="pic">☕🪑</span><span class="name" style="background:#e3f5f6">東西在哪裡？</span></a>
  </div>
</body>
</html>
